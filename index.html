<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sense of Science</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--card:#fff;--bd:#E5E0D8;--tx:#2C221E;--mu:#7a6e66;--ac:#9E6238;--ac2:#B37D4E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1a19;--bd:#2f2b28;--tx:#f1ebe4;--mu:#a39a92}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1a19;--bd:#2f2b28;--tx:#f1ebe4;--mu:#a39a92}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0 0 10px}h2{font-size:26px}h3{font-size:18px}
.app{display:flex;min-height:100vh}
nav{width:220px;padding:20px 14px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
nav .lg{font:700 22px 'Playfair Display',serif;margin:0 0 16px 8px}
nav a{padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--mu);display:flex;gap:10px}nav a.on{background:var(--ac);color:#fff}
main{flex:1;padding:22px;max-width:1100px;margin:0 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 10px #2c221e12}
.g{display:grid;gap:14px;margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:3px 0 8px}
textarea{min-height:70px}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}.btn:hover{background:var(--ac2)}.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px}
.b{padding:2px 9px;border-radius:99px;font-size:12px;white-space:nowrap;display:inline-block}
.tag{padding:5px 10px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-size:13px;background:none;color:var(--mu);flex:0 0 auto}.tag.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{background:#2C221E;color:#FAF7F2;border-radius:20px;padding:26px;margin-bottom:14px}.hero h1{font-size:clamp(22px,4vw,34px)}.hero p{color:#d9c9b8;margin:6px 0 0;font-style:italic}
.mu{color:var(--mu);font-size:13px}.big{font:700 40px 'Playfair Display',serif;color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}.hm i{border-radius:3px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:var(--ac)}
.fx{font-size:20px;font-family:'Playfair Display',serif;padding:10px 0}
a.x{color:var(--mu);cursor:pointer;font-size:12px}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:8px;background:var(--bg);z-index:5;align-items:center}nav .lg{display:none}nav a{white-space:nowrap;padding:8px 10px}main{padding:14px}}
.drop{display:block;border:2px dashed var(--ac2);border-radius:14px;padding:18px;text-align:center;cursor:pointer;margin-bottom:10px;color:var(--ac)}.dr{display:flex;gap:6px;flex:1 1 220px}.dr select{flex:1;min-width:0}.av{border-radius:50%;object-fit:cover;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;flex:none!important;font-family:'Playfair Display',serif}</style></head><body><div class="app"><nav id="nv"></nav><main id="m"></main></div>
<script>
const SUB=['Physics 1st Paper','Physics 2nd Paper','Chemistry 1st Paper','Chemistry 2nd Paper','Higher Math 1st Paper','Higher Math 2nd Paper','English'];
const COL=['#9E6238','#c98b5a','#4f7a6b','#6fa393','#5b6b9e','#8590c0','#b05a6b'];
const CH=[['Physical World & Measurement (ভৌত জগৎ ও পরিমাপ)','Vector (ভেক্টর)','Dynamics / Motion (গতিবিদ্যা)','Newtonian Mechanics (নিউটনীয় বলবিদ্যা)','Work, Energy & Power (কাজ, শক্তি ও ক্ষমতা)','Gravitation (মহাকর্ষ ও অভিকর্ষ)','Structural Properties of Matter (পদার্থের গাঠনিক ধর্ম)','Periodic Motion (পর্যাবৃত্ত গতি)','Waves (তরঙ্গ)','Ideal Gas & Kinetic Theory (আদর্শ গ্যাস ও গ্যাসের গতিতত্ত্ব)'],
['Thermodynamics (তাপগতিবিদ্যা)','Static Electricity (স্থির তড়িৎ)','Current Electricity (চল তড়িৎ)','Magnetic Effects & Magnetism (চৌম্বক ক্রিয়া ও চুম্বকত্ব)','EM Induction & AC (তড়িৎচুম্বকীয় আবেশ ও পরিবর্তী প্রবাহ)','Geometrical Optics (জ্যামিতিক আলোকবিজ্ঞান)','Physical Optics (ভৌত আলোকবিজ্ঞান)','Modern Physics (আধুনিক পদার্থবিজ্ঞান)','Atomic Model & Nuclear Physics (পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান)','Semiconductor & Electronics (সেমিকন্ডাক্টর ও ইলেকট্রনিক্স)','Astronomy (জ্যোতির্বিজ্ঞান)'],
['Laboratory Safety (ল্যাবরেটরির নিরাপদ ব্যবহার)','Qualitative Chemistry (গুণগত রসায়ন)','Periodic Table & Bonding (পর্যায়বৃত্ত ধর্ম ও রাসায়নিক বন্ধন)','Chemical Changes (রাসায়নিক পরিবর্তন)','Occupational Chemistry (কর্মমুখী রসায়ন)'],
['Environmental Chemistry (পরিবেশ রসায়ন)','Organic Chemistry (জৈব রসায়ন)','Quantitative Chemistry (পরিমাণগত রসায়ন)','Electrochemistry (তড়িৎ রসায়ন)','Economic Chemistry (অর্থনৈতিক রসায়ন)'],
['Matrices & Determinants (ম্যাট্রিক্স ও নির্ণায়ক)','Vectors (ভেক্টর)','Straight Lines (সরলরেখা)','Circle (বৃত্ত)','Permutation & Combination (বিন্যাস ও সমাবেশ)','Trigonometric Ratios (ত্রিকোণমিতিক অনুপাত)','Associated & Compound Angles (সংযুক্ত ও যৌগিক কোণ)','Functions & Graphs (ফাংশন ও লেখচিত্র)','Differentiation (অন্তরীকরণ)','Integration (যোগজীকরণ)'],
['Real Numbers & Inequalities (বাস্তব সংখ্যা ও অসমতা)','Linear Programming (যোগাশ্রয়ী প্রোগ্রাম)','Complex Numbers (জটিল সংখ্যা)','Polynomials & Equations (বহুপদী ও বহুপদী সমীকরণ)','Binomial Expansion (দ্বিপদী বিস্তৃতি)','Conics (কণিক)','Inverse Trig Functions & Equations (বিপরীত ত্রিকোণমিতিক ফাংশন ও সমীকরণ)','Statics (স্থিতিবিদ্যা)','Dynamics (গতিবিদ্যা)','Probability (সম্ভাবনা)'],
['Grammar','Writing','Reading Comprehension','Vocabulary']];
const ST=['Not Started','Class Done','Question Bank Solved','Mastered'],EM=['🔴','🟡','🔵','🟢'];
const TAGS=['Conceptual Error','Calculation Mistake','Time Shortage','Formula Forgotten','Careless Error'];
const QT=['Nothing in life is to be feared, it is only to be understood. — Marie Curie','The important thing is not to stop questioning. — Albert Einstein','The first principle is that you must not fool yourself. — Richard Feynman'];
let S={prof:{},logs:[],mist:[],exams:[],syl:{},goal:4,hsc:'2027-04-01',adm:'2027-01-15',forms:[
{s:0,ch:'Newtonian Mechanics',t:'v = u + at'},{s:0,ch:'Newtonian Mechanics',t:'s = ut + ½at^2'},{s:1,ch:'Thermodynamics',t:'PV = nRT'},{s:1,ch:'Current Electricity',t:'V = IR'},{s:3,ch:'Quantitative Chemistry',t:'pH = -log[H^+]'},{s:5,ch:'Integration',t:'∫x^n dx = x^{n+1}/(n+1) + C'},{s:4,ch:'Trigonometric Ratios',t:'sin^2θ + cos^2θ = 1'}]};
try{Object.assign(S,JSON.parse(localStorage.getItem('sos')||'{}'))}catch(e){}
if(!S.v2){S.syl={};S.v2=1}
const save=()=>{try{localStorage.setItem('sos',JSON.stringify(S))}catch(e){alert('Storage is full or unavailable. Remove some mistake images.')}};
const $=s=>document.querySelector(s),g=id=>$('#'+id).value,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),td=()=>ymd(new Date()),addD=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return ymd(x)};
const hm=m=>Math.floor(m/60)+'h '+m%60+'m',sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const opts=(sel,all)=>(all?'<option value="">All subjects</option>':'')+SUB.map((s,i)=>`<option value="${i}" ${sel==i&&sel!==''?'selected':''}>${s}</option>`).join('');
const bdg=i=>`<span class="b" style="background:${COL[i]}22;color:${COL[i]}">${SUB[i]}</span>`;
const math=s=>esc(s).replace(/\^\{([^}]*)\}|\^(\S)/g,(m,a,b)=>`<sup>${a||b}</sup>`).replace(/_\{([^}]*)\}|_(\S)/g,(m,a,b)=>`<sub>${a||b}</sub>`);
const cd=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
let F={h:'',fq:'',fs:'',qs:'',qt:'',es:''},MS={tags:[],img:'',q:null,i:0,show:0},T={m:'sw',run:0,sec:0,ph:'s',st:0},cur='dash';
const NAV=[['dash','◐','Dashboard'],['timer','⏱','Study Timer'],['mist','✎','Mistake Bank'],['exam','◈','Exam Scores'],['syl','☰','Syllabus'],['form','∑','Formulas'],['prof','☺','Profile']];
function go(v){cur=v;$('#nv').innerHTML='<div class="lg">Sense of Science</div>'+NAV.map(n=>`<a class="${n[0]==v?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')+'<a onclick="tgl()" style="margin-top:auto">◑ Theme</a>';$('#m').innerHTML=V[v]();scrollTo(0,0)}
function tgl(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark'}
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
setInterval(()=>{if(!T.run)return;if(T.m=='sw'){T.sec++;T.st++}else{T.sec--;if(T.ph=='s')T.st++;if(T.sec<=0){T.ph=T.ph=='s'?'b':'s';T.sec=T.ph=='s'?1500:300}}const e=$('#tm');if(e)e.textContent=fmtT(T.sec)},1000);
const V={};
V.dash=()=>{const t=td(),tm=sum(S.logs.filter(l=>l.d==t),l=>l.min),gm=S.goal*60,p=Math.min(1,tm/gm),C=2*Math.PI*52;
const wk=SUB.map((_,i)=>sum(S.logs.filter(l=>l.s==i&&l.d>addD(t,-7)),l=>l.min)),mx=Math.max(...wk,1);
const bars=wk.map((v,i)=>`<g transform="translate(0,${i*30})"><text x="0" y="14" font-size="11" fill="currentColor">${SUB[i].replace(' Paper','')}</text><rect x="105" y="2" width="${v/mx*180}" height="16" rx="5" fill="${COL[i]}"/><text x="${110+v/mx*180}" y="15" font-size="11" fill="currentColor">${hm(v)}</text></g>`).join('');
const cells=[...Array(140)].map((_,k)=>{const d=addD(t,k-139),m=sum(S.logs.filter(l=>l.d==d),l=>l.min);return `<i title="${d}: ${hm(m)}" style="background:${m?`rgba(158,98,56,${Math.min(1,.25+m/240)})`:'var(--bd)'}"></i>`}).join('');
const w={};S.mist.filter(m=>m.st!='resolved').forEach(m=>{const k=SUB[m.s]+' → '+m.ch;w[k]=(w[k]||0)+1});const top=Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,3);
const tg={};S.mist.forEach(m=>m.tags.forEach(x=>tg[x]=(tg[x]||0)+1));const tt=Object.entries(tg).sort((a,b)=>b[1]-a[1])[0];
return `<div class="hero"><div class="row" style="flex-wrap:nowrap;gap:14px">${av(64)}<div style="flex:1;min-width:0"><h1>Welcome Back, ${esc(nm())} 👋</h1><div style="opacity:.8">Sense of Science Dashboard${S.prof.inst?' · '+esc(S.prof.inst):''}</div></div></div><p>“${esc(QT[new Date().getDate()%3])}”</p></div>
<div class="g g2"><div class="card" style="text-align:center"><h3>Today's goal</h3><svg width="140" height="140" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="#9E6238" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">${Math.round(p*100)}%</text></svg>
<div>${hm(tm)} of <input type="number" min="1" max="16" value="${S.goal}" style="width:64px;display:inline" onchange="S.goal=+this.value||4;save();go('dash')"> h</div></div>
<div class="card"><h3>Exam countdown</h3><div class="row"><div><div class="big">${Math.max(0,cd(S.hsc))}</div><div class="mu">days to HSC</div>${dsel('hc',S.hsc,"S.hsc=gd('hc');save();go('dash')")}</div><div><div class="big">${Math.max(0,cd(S.adm))}</div><div class="mu">days to admission test</div>${dsel('ad',S.adm,"S.adm=gd('ad');save();go('dash')")}</div></div><div class="mu">Dates are editable.</div></div></div>
<div class="card g" style="margin-bottom:14px"><h3 style="margin:0">Quick actions</h3><div class="row"><button class="btn" onclick="go('timer')">Start Live Timer</button><button class="btn o" onclick="go('timer')">Log Study Hours</button><button class="btn o" onclick="go('mist')">Add Mistake</button><button class="btn o" onclick="go('exam')">Add Exam Score</button></div></div>
<div class="g g2"><div class="card"><h3>Hours by subject, last 7 days</h3><svg viewBox="0 0 400 210" width="100%">${bars}</svg></div>
<div class="card"><h3>Weak spot detector</h3>${top.length?top.map(x=>`<p style="margin:6px 0">⚠ <b>${esc(x[0])}</b><br><span class="mu">${x[1]} unresolved mistake${x[1]>1?'s':''}</span></p>`).join('')+(tt?`<p class="mu">Most common error type: ${tt[0]} (${tt[1]})</p>`:''):'<p class="mu">Add mistakes in the Mistake Bank and your weakest chapters appear here.</p>'}</div></div>
<div class="card"><h3>Study consistency, last 20 weeks</h3><div class="hm">${cells}</div></div>`};
V.timer=()=>{const hs=S.logs.map((l,i)=>[l,i]).filter(x=>F.h===''||x[0].s==F.h).sort((a,b)=>a[0].d<b[0].d?1:-1).slice(0,60);
return `<h2>Study Timer</h2><div class="g g2"><div class="card" style="text-align:center"><div class="row" style="justify-content:center"><button class="tag ${T.m=='sw'?'on':''}" onclick="setM('sw')">Stopwatch</button><button class="tag ${T.m=='pm'?'on':''}" onclick="setM('pm')">Pomodoro 25+5</button></div>
<div class="big" id="tm" style="font-size:64px;margin:12px 0">${fmtT(T.sec)}</div><div class="mu">${T.m=='pm'?(T.ph=='s'?'Study time':'Break'):'Counting up'} · studied this session: ${hm(Math.round(T.st/60))}</div>
<div class="row" style="margin-top:10px"><button class="btn" onclick="T.run^=1;go('timer')">${T.run?'Pause':'Start'}</button><button class="btn o" onclick="setM(T.m)">Reset</button></div></div>
<div class="card"><h3>Save session</h3><select id="ss">${opts(0)}</select><input id="sc" placeholder="Chapter"><button class="btn" onclick="saveSess()">Save ${Math.round(T.st/60)} min</button></div></div>
<div class="card" style="margin-bottom:14px"><h3>Manual log</h3><div class="row"><div><label class="mu">Subject</label><select id="ls">${opts(0)}</select></div><div><label class="mu">Chapter</label><input id="lc"></div><div><label class="mu">Minutes</label><input id="lm" type="number" min="1"></div><div><label class="mu">Date</label>${dsel('ld',td())}</div></div><input id="ln" placeholder="Notes"><button class="btn" onclick="addLog()">Add log</button></div>
<div class="card"><div class="row"><h3 style="margin:0">History</h3><select onchange="F.h=this.value;go('timer')">${opts(F.h,1)}</select></div><div class="tw"><table><tr><th>Date</th><th>Subject</th><th>Chapter</th><th>Time</th><th>Notes</th><th></th></tr>${hs.map(([l,i])=>`<tr><td>${l.d}</td><td>${bdg(l.s)}</td><td>${esc(l.ch)}</td><td>${hm(l.min)}</td><td>${esc(l.n)}</td><td><a class="x" onclick="S.logs.splice(${i},1);save();go('timer')">delete</a></td></tr>`).join('')||'<tr><td colspan="6" class="mu">No sessions yet. Start the timer or add a manual log.</td></tr>'}</table></div></div>`};
function setM(m){T={m,run:0,sec:m=='sw'?0:1500,ph:'s',st:T.st};go('timer')}
function saveSess(){const min=Math.round(T.st/60);if(!min)return alert('Study at least one minute first.');S.logs.push({s:+g('ss'),ch:g('sc'),min,d:td(),n:'Timer session'});T.st=0;T.run=0;T.sec=T.m=='sw'?0:1500;save();go('timer')}
function addLog(){const m=+g('lm');if(!m)return alert('Enter the minutes studied.');S.logs.push({s:+g('ls'),ch:g('lc'),min:m,d:gd('ld'),n:g('ln')});save();go('timer')}
V.mist=()=>{const q=MS.q,L=S.mist.map((m,i)=>[m,i]);let quiz='';
if(q){const m=S.mist[q[MS.i]];quiz=m?`<div class="card" style="margin-bottom:14px"><h3>Review ${MS.i+1} of ${q.length}</h3>${bdg(m.s)} <span class="mu">${esc(m.ch)} · ${esc(m.tp)}</span>${m.img?`<img src="${m.img}" style="max-width:100%;border-radius:12px;display:block;margin:8px 0">`:''}${MS.show?`<p><b>Answer:</b> ${esc(m.ans)}</p><p>${esc(m.ex)}</p><div class="row"><button class="btn" onclick="rate(true)">Resolved</button><button class="btn o" onclick="rate(false)">Needs Review</button></div>`:'<button class="btn" onclick="MS.show=1;go(\'mist\')">Show answer</button>'}</div>`:`<div class="card" style="margin-bottom:14px"><h3>Review finished 🎉</h3><button class="btn o" onclick="MS.q=null;go('mist')">Close</button></div>`}
return `<h2>Mistake Bank</h2><div class="card" style="margin-bottom:14px"><h3>Add mistake</h3><label class="drop" for="mf"><div style="font-size:30px">🖼️</div><b>Add math question image</b><div class="mu">Tap to choose from gallery or take a photo</div></label><input id="mf" type="file" accept="image/*" hidden onchange="pickImg(this)"><div id="pv">${MS.img?`<img src="${MS.img}" style="max-width:100%;max-height:240px;border-radius:10px"><div class="mu">✓ Image added</div>`:''}</div>
<div class="row"><div><select id="ms">${opts(0)}</select></div><div><input id="mc" placeholder="Chapter"></div><div><input id="mt" placeholder="Topic"></div></div><input id="ma" placeholder="Correct answer"><textarea id="me" placeholder="Detailed explanation"></textarea>
<div id="tg" class="row" style="margin-bottom:10px">${TAGS.map((t,i)=>`<button class="tag ${MS.tags.includes(t)?'on':''}" onclick="tagT(${i})">${t}</button>`).join('')}</div><button class="btn" onclick="addMist()">Save mistake</button></div>
<div class="card" style="margin-bottom:14px"><h3>Quiz mode</h3><div class="row"><select id="qs">${opts(F.qs,1)}</select><select id="qt"><option value="">All error tags</option>${TAGS.map(t=>`<option ${F.qt==t?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="startQ()">Start review</button></div><div class="mu">Resolved mistakes come back later, at growing intervals.</div></div>${quiz}
<div class="g">${L.map(([m,i])=>`<div class="card">${bdg(m.s)} <span class="b" style="background:${m.st=='resolved'?'#4f7a6b22':'#b05a6b22'}">${m.st=='resolved'?'Resolved':'Needs Review'}</span> <b>${esc(m.ch)}</b> <span class="mu">${esc(m.tp)}</span><div class="mu">${m.tags.join(', ')}</div>${m.img?`<img src="${m.img}" style="max-width:100%;border-radius:10px;margin-top:6px">`:''}<p style="margin:6px 0">${esc(m.ans)}</p><a class="x" onclick="S.mist.splice(${i},1);save();go('mist')">delete</a></div>`).join('')||'<p class="mu">No mistakes logged yet. Add the first one above.</p>'}</div>`};
function tagT(i){const t=TAGS[i],k=MS.tags.indexOf(t);k<0?MS.tags.push(t):MS.tags.splice(k,1);document.querySelectorAll('#tg .tag')[i].classList.toggle('on')}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;rs(f,700,.6,u=>{MS.img=u;$('#pv').innerHTML=`<img src="${u}" style="max-width:100%;max-height:240px;border-radius:10px"><div class="mu">✓ Image added</div>`})}
function rs(f,mx,q,cb){const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const k=Math.min(1,mx/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))}catch(e){alert('Could not process this image.')}URL.revokeObjectURL(u)};im.onerror=()=>alert('This image format is not supported. Use JPG or PNG.');im.src=u}
function pickPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;rs(f,320,.8,u=>{S.prof.photo=u;save();go('prof')})}
let PM=0;function saveProf(){S.prof=Object.assign(S.prof,{name:g('pn'),inst:g('pi'),year:g('py'),age:g('pa'),gender:g('pg')});save();PM=1;go('prof');PM=0}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dsel=(id,v,fn)=>{const[y,m,d]=(v||td()).split('-').map(Number),Y=new Date().getFullYear(),a=fn?` onchange="${fn}"`:'';return `<div class="dr"><select id="${id}d"${a}>${[...Array(31)].map((_,i)=>`<option ${i+1==d?'selected':''}>${i+1}</option>`).join('')}</select><select id="${id}m"${a}>${MN.map((n,i)=>`<option value="${i+1}" ${i+1==m?'selected':''}>${n}</option>`).join('')}</select><select id="${id}y"${a}>${[...Array(8)].map((_,i)=>`<option ${Y-2+i==y?'selected':''}>${Y-2+i}</option>`).join('')}</select></div>`};
const gd=id=>{const y=+g(id+'y'),m=+g(id+'m'),d=Math.min(+g(id+'d'),new Date(y,m,0).getDate());return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')};
const nm=()=>S.prof.name||'Jayed Hasan Fatha',av=z=>S.prof.photo?`<img class="av" src="${S.prof.photo}" style="width:${z}px;height:${z}px">`:`<div class="av" style="width:${z}px;height:${z}px;font-size:${z/2.2}px">${esc(nm()[0])}</div>`;
V.prof=()=>{const p=S.prof;return `<h2>My Profile</h2><div class="card" style="max-width:560px"><div class="row" style="justify-content:center;margin-bottom:10px">${av(110)}</div><label class="drop" for="pf" style="padding:10px">📷 ${p.photo?'Change':'Add'} profile photo</label><input id="pf" type="file" accept="image/*" hidden onchange="pickPhoto(this)">
<label class="mu">Full name</label><input id="pn" value="${esc(nm())}"><label class="mu">Institution</label><input id="pi" value="${esc(p.inst||'')}" placeholder="School / college name">
<div class="row"><div><label class="mu">Year (সাল)</label><input id="py" type="number" value="${esc(p.year||'')}" placeholder="e.g. 2027"></div><div><label class="mu">Age</label><input id="pa" type="number" value="${esc(p.age||'')}"></div></div>
<label class="mu">Gender</label><select id="pg">${['','Male (পুরুষ)','Female (নারী)','Other (অন্যান্য)'].map(x=>`<option ${p.gender==x?'selected':''}>${x}</option>`).join('')}</select>
<button class="btn" onclick="saveProf()">Save profile</button>${PM?'<p style="color:#4f7a6b">✓ Profile saved</p>':''}</div>`};
function addMist(){if(!g('mc')&&!MS.img)return alert('Add an image or enter a chapter name.');S.mist.push({s:+g('ms'),ch:g('mc'),tp:g('mt'),ans:g('ma'),ex:g('me'),tags:MS.tags,img:MS.img,st:'review',due:td(),iv:0});MS.tags=[];MS.img='';save();go('mist')}
function startQ(){F.qs=g('qs');F.qt=g('qt');MS.q=S.mist.map((m,i)=>i).filter(i=>{const m=S.mist[i];return(F.qs===''||m.s==F.qs)&&(!F.qt||m.tags.includes(F.qt))&&(m.st!='resolved'||m.due<=td())});MS.i=0;MS.show=0;go('mist')}
function rate(ok){const m=S.mist[MS.q[MS.i]];m.st=ok?'resolved':'review';m.iv=ok?Math.max(2,m.iv*2):1;m.due=addD(td(),m.iv);MS.i++;MS.show=0;save();go('mist')}
V.exam=()=>{const ex=[...S.exams].sort((a,b)=>a.d>b.d?1:-1),t0=+new Date(ex[0]?.d),t1=+new Date(ex.at(-1)?.d),x=d=>t1>t0?40+(new Date(d)-t0)/(t1-t0)*330:205,y=v=>170-Math.max(0,v)*1.5;
const lines=SUB.map((_,i)=>{const p=ex.filter(e=>e.s==i);return p.length?`<polyline fill="none" stroke="${COL[i]}" stroke-width="2.5" points="${p.map(e=>x(e.d)+','+y(e.o/e.t*100)).join(' ')}"/>`+p.map(e=>`<circle cx="${x(e.d)}" cy="${y(e.o/e.t*100)}" r="4" fill="${COL[i]}"><title>${esc(e.n)}: ${(e.o/e.t*100).toFixed(1)}%</title></circle>`).join(''):''}).join('');
return `<h2>Exam Scores</h2><div class="card" style="margin-bottom:14px"><h3>Add exam result</h3><div class="row"><input id="en" placeholder="Exam name">${dsel('ed',td())}<select id="es">${opts(0)}</select></div><div class="row"><input id="et" type="number" placeholder="Total marks"><input id="eo" type="number" step="0.25" placeholder="Obtained marks"><input id="eg" type="number" step="0.25" placeholder="Negative marks"><input id="er" placeholder="Rank / cut-off"></div><button class="btn" onclick="addExam()">Save result</button></div>
<div class="card" style="margin-bottom:14px"><h3>Score trend (%)</h3><svg viewBox="0 0 400 190" width="100%" style="color:var(--mu)">${[0,50,100].map(v=>`<line x1="40" x2="380" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="4" y="${y(v)+4}" font-size="10" fill="currentColor">${v}%</text>`).join('')}${lines}</svg><div class="row">${SUB.map((s,i)=>`<span class="mu"><span style="color:${COL[i]}">●</span> ${s.replace(' Paper','')}</span>`).join('')}</div></div>
<div class="card"><div class="tw"><table><tr><th>Date</th><th>Exam</th><th>Subject</th><th>Marks</th><th>Accuracy</th><th>Negative lost</th><th>Rank</th><th></th></tr>${[...ex].reverse().map(e=>`<tr><td>${e.d}</td><td>${esc(e.n)}</td><td>${bdg(e.s)}</td><td>${e.o}/${e.t}</td><td>${(e.o/e.t*100).toFixed(1)}%</td><td>${e.g}</td><td>${esc(e.r)}</td><td><a class="x" onclick="S.exams.splice(S.exams.indexOf(S.exams.find(z=>z===S.exams[${S.exams.indexOf(e)}])),1);save();go('exam')">delete</a></td></tr>`).join('')||'<tr><td colspan="8" class="mu">No exam results yet.</td></tr>'}</table></div><div class="mu">Accuracy = obtained marks ÷ total marks. Negative marks are shown as marks lost.</div></div>`};
function addExam(){const t=+g('et'),o=+g('eo');if(!t||g('eo')==='')return alert('Enter total and obtained marks.');S.exams.push({n:g('en')||'Exam',d:gd('ed'),s:+g('es'),t,o,g:+g('eg')||0,r:g('er')});save();go('exam')}
V.syl=()=>{const pr=CH.map((c,i)=>sum(c,(_,j)=>0)||sum(c.map((_,j)=>S.syl[i+'|'+j]||0),v=>v)/(3*c.length)),all=pr.reduce((a,b)=>a+b,0)/7;
return `<h2>Syllabus Progress</h2><div class="card" style="margin-bottom:14px"><h3>Overall: ${Math.round(all*100)}%</h3><div class="bar"><b style="width:${all*100}%"></b></div></div>
${CH.map((c,i)=>`<details class="card" style="margin-bottom:10px"><summary style="cursor:pointer"><b>${SUB[i]}</b> <span class="mu">${Math.round(pr[i]*100)}%</span><div class="bar" style="margin-top:6px"><b style="width:${pr[i]*100}%;background:${COL[i]}"></b></div></summary>${c.map((n,j)=>{const v=S.syl[i+'|'+j]||0;return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd)"><div style="flex:2 1 180px">${EM[v]} ${n}</div><select style="flex:1 1 150px" onchange="S.syl['${i}|${j}']=+this.value;save();go('syl');document.querySelectorAll('details')[${i}].open=true">${ST.map((s,k)=>`<option value="${k}" ${k==v?'selected':''}>${s}</option>`).join('')}</select></div>`}).join('')}</details>`).join('')}`};
V.form=()=>{const L=S.forms.map((f,i)=>[f,i]).filter(([f])=>(F.fs===''||f.s==F.fs)&&(!F.fq||(f.ch+f.t).toLowerCase().includes(F.fq.toLowerCase())));
return `<h2>Formula Sheet</h2><div class="card" style="margin-bottom:14px"><h3>Add formula</h3><div class="row"><select id="fs1">${opts(0)}</select><input id="fc" placeholder="Chapter"></div><input id="ft" placeholder="e.g. E = mc^2   or   x_{n+1} = x_n - f(x_n)/f'(x_n)"><div class="mu" style="margin-bottom:8px">Use ^ for powers and _ for subscripts. Braces group more than one character.</div><button class="btn" onclick="addForm()">Save formula</button></div>
<div class="row" style="margin-bottom:14px"><input placeholder="Search formulas or chapters" value="${esc(F.fq)}" oninput="F.fq=this.value;fl()" id="fq"><select onchange="F.fs=this.value;go('form')">${opts(F.fs,1)}</select></div><div class="g g2" id="fl">${fc(L)}</div>`};
const fc=L=>L.map(([f,i])=>`<div class="card">${bdg(f.s)} <span class="mu">${esc(f.ch)}</span><div class="fx">${math(f.t)}</div><a class="x" onclick="S.forms.splice(${i},1);save();go('form')">delete</a></div>`).join('')||'<p class="mu">No formulas match. Try a different search.</p>';
function fl(){const L=S.forms.map((f,i)=>[f,i]).filter(([f])=>(F.fs===''||f.s==F.fs)&&(!F.fq||(f.ch+f.t).toLowerCase().includes(F.fq.toLowerCase())));$('#fl').innerHTML=fc(L)}
function addForm(){if(!g('ft'))return alert('Enter the formula.');S.forms.push({s:+g('fs1'),ch:g('fc'),t:g('ft')});save();go('form')}
go('dash');
</script></body></html>
