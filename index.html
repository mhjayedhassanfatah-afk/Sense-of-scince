<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= SUPABASE CONFIG =================
   1) Create a Supabase project.
   2) Put your Project URL and anon/publishable key below.
   3) NEVER put a service_role/secret key here.
*/
const SUPABASE_URL = 'https://nbjigdhxwcpwiujziung.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_JAQ9z5pukAvHm8H1J-xcrw_QGg0Wow8';

let sb = null;
let cloudReady = false;
let cloudSaveTimer = null;
let CU=null;

if (
  SUPABASE_URL.startsWith('https://') &&
  !SUPABASE_URL.includes('PASTE_') &&
  SUPABASE_ANON_KEY &&
  !SUPABASE_ANON_KEY.includes('PASTE_')
) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

async function currentUser(){
  if(!sb) return null;
  const {data:{user}} = await sb.auth.getUser();
  return user || null;
}

async function cloudLoad(){
  const user = await currentUser();
  if(!user) return;

  const {data, error} = await sb
    .from('user_data')
    .select('data')
    .eq('user_id', user.id)
    .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(data && data.data){
    try{
      const remote = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
      Object.assign(S, remote);
      saveLocalOnly();
    }catch(e){ console.error('Cloud data parse error', e); }
  }else{
    if(localStorage.getItem('sos_claimed')){Object.assign(S,DEF());}
    else{try{localStorage.setItem('sos_claimed','1')}catch(e){}}
    await cloudSave();
  }
}

async function cloudSave(){
  const user = await currentUser();
  if(!user) return;

  const {error} = await sb.from('user_data').upsert({
    user_id: user.id,
    data: S,
    updated_at: new Date().toISOString()
  }, {onConflict:'user_id'});

  if(error) console.error('Cloud save error:', error);
}

function queueCloudSave(){
  if(!cloudReady) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(cloudSave, 500);
}

function saveLocalOnly(){
  try{
    localStorage.setItem('sos', JSON.stringify(S));
  }catch(e){
    alert('Storage is full or unavailable. Remove some mistake images.');
  }
}

async function saveAll(){
  saveLocalOnly();
  queueCloudSave();
}

async function signOut(){
  try{await cloudSave();localStorage.removeItem('sos')}catch(e){}
  if(sb) await sb.auth.signOut();
  location.reload();
}

function showAuth(message=''){document.body.innerHTML=`<div class="authw"><div class="card auth tilt"><h1 style="font-size:34px">Sense of Science</h1><p class="mu">Study &amp; exam tracker. Sign in to use your data on any phone.</p><div id="authMsg" style="min-height:22px;margin:8px 0;color:var(--ac)">${message}</div>
<div class="row" style="margin-bottom:8px"><button class="tag on" id="t1" onclick="aTab(1)">Email</button><button class="tag" id="t2" onclick="aTab(2)">Phone (WhatsApp / SMS)</button></div>
<div id="aE"><label class="mu">Your name (for sign up)</label><input id="authName" placeholder="Full name" autocomplete="name"><label class="mu">Email</label><input id="authEmail" type="email" autocomplete="email"><label class="mu">Password</label><input id="authPassword" type="password" placeholder="At least 6 characters" autocomplete="current-password"><button class="btn" style="width:100%" onclick="loginUser()">Login</button><button class="btn o" style="width:100%;margin-top:8px" onclick="signupUser()">Create account</button></div>
<div id="aP" style="display:none"><label class="mu">Phone number with country code</label><input id="authPhone" type="tel" placeholder="+8801XXXXXXXXX" autocomplete="tel"><div class="row"><button class="btn" onclick="sendOtp('whatsapp')">Code via WhatsApp</button><button class="btn o" onclick="sendOtp('sms')">Code via SMS</button></div><label class="mu" style="margin-top:8px;display:block">Code</label><input id="authCode" inputmode="numeric" maxlength="8"><button class="btn" style="width:100%" onclick="verifyOtp()">Verify and login</button></div></div></div>`}
function aTab(n){document.querySelector('#aE').style.display=n==1?'':'none';document.querySelector('#aP').style.display=n==2?'':'none';document.querySelector('#t1').classList.toggle('on',n==1);document.querySelector('#t2').classList.toggle('on',n==2)}
async function sendOtp(ch){const phone=document.querySelector('#authPhone').value.trim();if(!/^\+\d{8,15}$/.test(phone))return authMessage('Enter the number with country code, like +8801XXXXXXXXX.');const {error}=await sb.auth.signInWithOtp({phone,options:{channel:ch}});authMessage(error?error.message:'Code sent. Enter it below.')}
async function verifyOtp(){const phone=document.querySelector('#authPhone').value.trim(),token=document.querySelector('#authCode').value.trim();const {error}=await sb.auth.verifyOtp({phone,token,type:'sms'});if(error)return authMessage(error.message);location.reload()}
function authMessage(x){
  const e=document.querySelector('#authMsg');
  if(e) e.textContent=x;
}

async function loginUser(){
  if(!sb) return authMessage('First add your Supabase URL and anon key in the code.');
  const email=document.querySelector('#authEmail').value.trim();
  const password=document.querySelector('#authPassword').value;
  if(!email || !password) return authMessage('Enter email and password.');

  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return authMessage(error.message);
  location.reload();
}

async function signupUser(){
  if(!sb) return authMessage('First add your Supabase URL and anon key in the code.');
  const email=document.querySelector('#authEmail').value.trim();
  const password=document.querySelector('#authPassword').value;
  if(!email || !password) return authMessage('Enter email and password.');
  if(password.length<6) return authMessage('Password must be at least 6 characters.');

  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:(document.querySelector('#authName').value||'').trim()}}});
  if(error) return authMessage(error.message);

  if(data.session){
    location.reload();
  }else{
    authMessage('Account created. Check your email if email confirmation is enabled.');
  }
}

async function bootAuth(){
  if(!sb){
    cloudReady=false;
    go('dash');
    return;
  }

  const user=await currentUser();
  if(!user){
    showAuth();
    return;
  }

  CU=user;cloudReady=true;
  await cloudLoad();
  go('dash');
}
</script>

['Laboratory Safety','Qualitative Chemistry','Periodic Table & Bonding','Chemical Changes','Occupational Chemistry'],

{s:0,ch:'Newtonian Mechanics',t:'v = u + at'},{s:0,ch:'Newtonian Mechanics',t:'s = ut + ½at^2'},{s:1,ch:'Thermodynamics',t:'PV = nRT'},{s:1,ch:'Current Electricity',t:'V = IR'},{s:3,ch:'Quantitative Chemistry',t:'pH = -log[H^+]'},{s:5,ch:'Integration',t:'∫x^n dx = x^{n+1}/(n+1) + C'},{s:4,ch:'Trigonometric Ratios',t:'sin^2θ + cos^2θ = 1'}]});

if(!S.v2){S.syl={};S.v2=1}
const save=()=>{saveAll()};
const $=s=>document.querySelector(s),g=id=>$('#'+id).value,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),td=()=>ymd(new Date()),addD=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return ymd(x)};
const hm=m=>Math.floor(m/60)+'h '+m%60+'m',sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const opts=(sel,all)=>(all?'<option value="">All subjects</option>':'')+SUB.map((s,i)=>`<option value="${i}" ${sel==i&&sel!==''?'selected':''}>${s}</option>`).join('');
const chOpts=(sel,sid)=>{const a=CH[+sid]||[];return '<option value="">Select chapter</option>'+a.map(c=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}</option>`).join('')};

function syncChapters(subjectId,chapterId){const s=$(subjectId),c=$(chapterId);if(!s||!c)return;const old=c.value;c.innerHTML=chOpts(old,s.value);if(!c.value&&old)c.value='';}
const bdg=i=>`<span class="b" style="background:${COL[i]}22;color:${COL[i]}">${SUB[i]}</span>`;
const math=s=>esc(s).replace(/\^\{([^}]*)\}|\^(\S)/g,(m,a,b)=>`<sup>${a||b}</sup>`).replace(/_\{([^}]*)\}|_(\S)/g,(m,a,b)=>`<sub>${a||b}</sub>`);
const cd=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
let F={h:'',fq:'',fs:'',qs:'',qt:'',es:''},MS={tags:[],img:'',q:null,i:0,show:0},T={m:'sw',run:0,sec:0,ph:'s',st:0},cur='dash';
const NAV=[['dash','◐','Dashboard'],['timer','⏱','Study Timer'],['mist','✎','Mistake Bank'],['exam','◈','Exam Scores'],['syl','☰','Syllabus'],['form','∑','Formulas'],['prof','☺','Profile'],['set','⚙','Settings']];
function go(v){cur=v;$('#nv').innerHTML='<div class="lg">Sense of Science</div>'+NAV.map(n=>`<a class="${n[0]==v?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')+'<a onclick="tgl()" style="margin-top:auto">◑ Theme</a><a onclick="signOut()">↪ Logout</a>';applyTheme();$('#m').innerHTML=V[v]();document.querySelectorAll('#m .card').forEach(c=>{if(!c.querySelector('input,select,textarea,.btn'))c.classList.add('tilt')});scrollTo(0,0)}

V.dash=()=>{const t=td(),tm=sum(S.logs.filter(l=>l.d==t),l=>l.min),gm=S.goal*60,p=Math.min(1,tm/gm),C=2*Math.PI*52;

const w={};S.mist.filter(m=>m.st!='resolved').forEach(m=>{const k=SUB[m.s]+' → '+m.ch;w[k]=(w[k]||0)+1});const top=Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,3);

return `<div class="hero"><div class="row" style="flex-wrap:nowrap;gap:14px">${av(64)}<div style="flex:1;min-width:0"><h1>Welcome Back, ${esc(nm())} 👋</h1><div style="opacity:.8">Sense of Science Dashboard${S.prof.inst?' · '+esc(S.prof.inst):''}<br><span style="font-size:12px;opacity:.8">${cloudReady?'☁ Cloud sync on':'💾 Local mode'}</span></div></div></div><p>“${esc(QT[new Date().getDate()%3])}”</p></div>
<div class="g g2"><div class="card" style="text-align:center"><h3>Today's goal</h3><svg width="140" height="140" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="#9E6238" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">${Math.round(p*100)}%</text></svg>
<div>${hm(tm)} of <input type="number" min="1" max="16" value="${S.goal}" style="width:64px;display:inline" onchange="S.goal=+this.value||4;save();go('dash')"> h</div></div>

${stats()}<div class="card g" style="margin-bottom:14px"><h3 style="margin:0">Quick actions</h3><div class="row"><button class="btn" onclick="go('timer')">Start Live Timer</button><button class="btn o" onclick="go('timer')">Log Study Hours</button><button class="btn o" onclick="go('mist')">Add Mistake</button><button class="btn o" onclick="go('exam')">Add Exam Score</button></div></div>
<div class="g g2"><div class="card"><h3>Hours by subject, last 7 days</h3><svg viewBox="0 0 400 210" width="100%">${bars}</svg></div>
<div class="card"><h3>Weak spot detector</h3>${top.length?top.map(x=>`<p style="margin:6px 0">⚠ <b>${esc(x[0])}</b><br><span class="mu">${x[1]} unresolved mistake${x[1]>1?'s':''}</span></p>`).join('')+(tt?`<p class="mu">Most common error type: ${tt[0]} (${tt[1]})</p>`:''):'<p class="mu">Add mistakes in the Mistake Bank and your weakest chapters appear here.</p>'}</div></div>
<div class="card"><h3>Study consistency, last 20 weeks</h3><div class="hm">${cells}</div></div>`};
V.timer=()=>{const hs=S.logs.map((l,i)=>[l,i]).filter(x=>F.h===''||x[0].s==F.h).sort((a,b)=>a[0].d<b[0].d?1:-1).slice(0,60);
return `<h2>Study Timer</h2><div class="g g2"><div class="card" style="text-align:center"><div class="row" style="justify-content:center"><button class="tag ${T.m=='sw'?'on':''}" onclick="setM('sw')">Stopwatch</button><button class="tag ${T.m=='pm'?'on':''}" onclick="setM('pm')">Pomodoro ${S.pm[0]}+${S.pm[1]}</button></div>
<div class="big" id="tm" style="font-size:64px;margin:12px 0">${fmtT(T.sec)}</div><div class="mu">${T.m=='pm'?(T.ph=='s'?'Study time':'Break'):'Counting up'} · studied this session: ${hm(Math.round(T.st/60))}</div>
<div class="row" style="margin-top:10px"><button class="btn" onclick="T.run^=1;go('timer')">${T.run?'Pause':'Start'}</button><button class="btn o" onclick="setM(T.m)">Reset</button></div></div>
<div class="card"><h3>Save session</h3>${subPick('ss',0,'sc')}${chSelect('sc',0)}<button class="btn" onclick="saveSess()">Save ${Math.round(T.st/60)} min</button></div></div>
<div class="card" style="margin-bottom:14px"><h3>Manual log</h3><div class="row"><div><label class="mu">Subject</label>${subPick('ls',0,'lc')}</div><div><label class="mu">Chapter</label>${chSelect('lc',0)}</div><div><label class="mu">Minutes</label><input id="lm" type="number" min="1"></div><div><label class="mu">Date</label>${dsel('ld',td())}</div></div><input id="ln" placeholder="Notes"><button class="btn" onclick="addLog()">Add log</button></div>
<div class="card"><div class="row"><h3 style="margin:0">History</h3><select onchange="F.h=this.value;go('timer')">${opts(F.h,1)}</select></div><div class="tw"><table><tr><th>Date</th><th>Subject</th><th>Chapter</th><th>Time</th><th>Notes</th><th></th></tr>${hs.map(([l,i])=>`<tr><td>${l.d}</td><td>${bdg(l.s)}</td><td>${esc(l.ch)}</td><td>${hm(l.min)}</td><td>${esc(l.n)}</td><td><a class="x" onclick="S.logs.splice(${i},1);save();go('timer')">delete</a></td></tr>`).join('')||'<tr><td colspan="6" class="mu">No sessions yet. Start the timer or add a manual log.</td></tr>'}</table></div></div>`};
function setM(m){T={m,run:0,sec:m=='sw'?0:S.pm[0]*60,ph:'s',st:T.st};go('timer')}
function saveSess(){const min=Math.round(T.st/60);if(!min)return alert('Study at least one minute first.');S.logs.push({s:+g('ss'),ch:g('sc'),min,d:td(),n:'Timer session'});T.st=0;T.run=0;T.sec=T.m=='sw'?0:S.pm[0]*60;save();go('timer')}
function addLog(){const m=+g('lm');if(!m)return alert('Enter the minutes studied.');S.logs.push({s:+g('ls'),ch:g('lc'),min:m,d:gd('ld'),n:g('ln')});save();go('timer')}
V.mist=()=>{const q=MS.q,L=S.mist.map((m,i)=>[m,i]);let quiz='';
if(q){const m=S.mist[q[MS.i]];quiz=m?`<div class="card" style="margin-bottom:14px"><h3>Review ${MS.i+1} of ${q.length}</h3>${bdg(m.s)} <span class="mu">${esc(m.ch)} · ${esc(m.tp)}</span>${m.img?`<img src="${m.img}" style="max-width:100%;border-radius:12px;display:block;margin:8px 0">`:''}${MS.show?`<p><b>Answer:</b> ${esc(m.ans)}</p><p>${esc(m.ex)}</p><div class="row"><button class="btn" onclick="rate(true)">Resolved</button><button class="btn o" onclick="rate(false)">Needs Review</button></div>`:'<button class="btn" onclick="MS.show=1;go(\'mist\')">Show answer</button>'}</div>`:`<div class="card" style="margin-bottom:14px"><h3>Review finished 🎉</h3><button class="btn o" onclick="MS.q=null;go('mist')">Close</button></div>`}
return `<h2>Mistake Bank</h2><div class="card" style="margin-bottom:14px"><h3>Add mistake</h3><label class="drop" for="mf"><div style="font-size:30px">🖼️</div><b>Add math question image</b><div class="mu">Tap to choose from gallery or take a photo</div></label><input id="mf" type="file" accept="image/*" hidden onchange="pickImg(this)"><div id="pv">${MS.img?`<img src="${MS.img}" style="max-width:100%;max-height:240px;border-radius:10px"><div class="mu">✓ Image added</div>`:''}</div>
<div class="row"><div>${subPick('ms',0,'mc')}</div><div>${chSelect('mc',0)}</div><div><input id="mt" placeholder="Topic"></div></div><input id="ma" placeholder="Correct answer"><textarea id="me" placeholder="Detailed explanation"></textarea>
<div id="tg" class="row" style="margin-bottom:10px">${TAGS.map((t,i)=>`<button class="tag ${MS.tags.includes(t)?'on':''}" onclick="tagT(${i})">${t}</button>`).join('')}</div><button class="btn" onclick="addMist()">Save mistake</button></div>
<div class="card" style="margin-bottom:14px"><h3>Quiz mode</h3><div class="row"><select id="qs">${opts(F.qs,1)}</select><select id="qt"><option value="">All error tags</option>${TAGS.map(t=>`<option ${F.qt==t?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="startQ()">Start review</button></div><div class="mu">Resolved mistakes come back later, at growing intervals.</div></div>${quiz}
<div class="g">${L.map(([m,i])=>`<div class="card">${bdg(m.s)} <span class="b" style="background:${m.st=='resolved'?'#4f7a6b22':'#b05a6b22'}">${m.st=='resolved'?'Resolved':'Needs Review'}</span> <b>${esc(m.ch)}</b> <span class="mu">${esc(m.tp)}</span><div class="mu">${m.tags.join(', ')}</div>${m.img?`<img src="${m.img}" style="max-width:100%;border-radius:10px;margin-top:6px">`:''}<p style="margin:6px 0">${esc(m.ans)}</p><a class="x" onclick="S.mist.splice(${i},1);save();go('mist')">delete</a></div>`).join('')||'<p class="mu">No mistakes logged yet. Add the first one above.</p>'}</div>`};
function tagT(i){const t=TAGS[i],k=MS.tags.indexOf(t);k<0?MS.tags.push(t):MS.tags.splice(k,1);document.querySelectorAll('#tg .tag')[i].classList.toggle('on')}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;rs(f,700,.6,u=>{MS.img=u;$('#pv').innerHTML=`<img src="${u}" style="max-width:100%;max-height:240px;border-radius:10px"><div class="mu">✓ Image added</div>`})}
function rs(f,mx,q,cb){const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const k=Math.min(1,mx/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))}catch(e){alert('Could not process this image.')}URL.revokeObjectURL(u)};im.onerror=()=>alert('This image format is not supported. Use JPG or PNG.');im.src=u}
function pickPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;rs(f,320,.8,u=>{S.prof.photo=u;save();go('prof')})}
let PM=0;function saveProf(){S.prof=Object.assign(S.prof,{name:g('pn'),inst:g('pi'),year:g('py'),age:g('pa'),gender:g('pg')});save();PM=1;go('prof');PM=0}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const IC=['⚛','⚛','⚗','⚗','∑','∑','Aa'],c2=i=>`color-mix(in srgb,${COL[i]} 55%,#000)`;
const pkv=i=>`<i class="sp" style="--c1:${COL[i]};--c2:${c2(i)}"></i><b>${SUB[i]}</b><span class="mu" style="margin-left:auto">Change ▾</span>`;
const subPick=(id,v=0,ch='')=>`<input type="hidden" id="${id}" value="${v}"><div class="pk" id="${id}_v" data-ch="${ch}" onclick="openSub('${id}')">${pkv(v)}</div>`;
function mdl(h){let m=$('#mdl');if(!m){m=document.createElement('div');m.id='mdl';m.onclick=e=>{if(e.target==m)mdl()};document.body.appendChild(m)}if(h){m.innerHTML='<div>'+h+'</div>';m.classList.add('on')}else m.classList.remove('on')}
function openSub(id){const cur=+g(id);mdl(`<h3>Choose subject</h3><div class="cvg">${SUB.map((s,i)=>`<div class="cv ${i==cur?'sel':''}" style="--c1:${COL[i]};--c2:${c2(i)}" onclick="setSub('${id}',${i})"><div style="font-size:26px;margin-bottom:auto">${IC[i]}</div><b>${s.replace(/ \d.. Paper/,'')}</b><span>${(s.match(/\d.. Paper/)||[''])[0]}</span></div>`).join('')}</div>`)}
function setSub(id,i){$('#'+id).value=i;const e=$('#'+id+'_v');e.innerHTML=pkv(i);const c=e.dataset.ch&&$('#'+e.dataset.ch);if(c)c.innerHTML=chOpts('',i);mdl()}
const dv=v=>{const d=new Date(v+'T00:00:00');return `<i class="dc"><small>${MN[d.getMonth()]}</small>${d.getDate()}</i><b>${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b><span class="mu" style="margin-left:auto">Change ▾</span>`};
const dsel=(id,v,fn)=>{v=v||td();window['_f'+id]=fn||'';return `<input type="hidden" id="${id}" value="${v}"><div class="pk" id="${id}_v" onclick="openCal('${id}')">${dv(v)}</div>`};

function openCal(id,ym){const v=g(id),[y,m]=(ym||v.slice(0,7)).split('-').map(Number),f=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),pm=ymd(new Date(y,m-2,1)).slice(0,7),nx=ymd(new Date(y,m,1)).slice(0,7);let c='';for(let i=0;i<f;i++)c+='<i></i>';for(let d=1;d<=n;d++){const t=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');c+=`<button class="cd ${t==v?'sel':''} ${t==td()?'tdy':''}" onclick="setDate('${id}','${t}')">${d}</button>`}
mdl(`<div class="row" style="flex-wrap:nowrap"><button class="btn o" style="flex:none" onclick="openCal('${id}','${pm}')">‹</button><h3 style="margin:0;text-align:center">${MN[m-1]} ${y}</h3><button class="btn o" style="flex:none" onclick="openCal('${id}','${nx}')">›</button></div><div class="cal">${['S','M','T','W','T','F','S'].map(x=>`<small>${x}</small>`).join('')}${c}</div>`)}
function setDate(id,t){$('#'+id).value=t;$('#'+id+'_v').innerHTML=dv(t);mdl();const f=window['_f'+id];if(f)Function(f)()}
const applyTheme=()=>{const r=document.documentElement;if(S.theme&&S.theme!='auto')r.dataset.theme=S.theme;else delete r.dataset.theme};

function tgl(){const dk=document.documentElement.dataset.theme=='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);setTheme(dk?'light':'dark')}
const stats=()=>{const dy=new Set(S.logs.map(l=>l.d));let k=0,d=td();if(!dy.has(d))d=addD(d,-1);while(dy.has(d)){k++;d=addD(d,-1)}

function expData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='sense-of-science-backup-'+td()+'.json';a.click()}
function impData(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(DEF(),JSON.parse(t));save();go('set');alert('Backup restored')}catch(e){alert('This file is not a valid backup.')}})}

const nm=()=>S.prof.name||(CU&&(CU.user_metadata&&CU.user_metadata.name||(CU.email||CU.phone||'').split('@')[0]))||'Student',av=z=>S.prof.photo?`<img class="av" src="${S.prof.photo}" style="width:${z}px;height:${z}px">`:`<div class="av" style="width:${z}px;height:${z}px;font-size:${z/2.2}px">${esc(nm()[0])}</div>`;

<button class="btn" onclick="saveProf()">Save profile</button>${PM?'<p style="color:#4f7a6b">✓ Profile saved</p>':''}</div>`};
function addMist(){if(!g('mc')&&!MS.img)return alert('Add an image or enter a chapter name.');S.mist.push({s:+g('ms'),ch:g('mc'),tp:g('mt'),ans:g('ma'),ex:g('me'),tags:MS.tags,img:MS.img,st:'review',due:td(),iv:0});MS.tags=[];MS.img='';save();go('mist')}
function startQ(){F.qs=g('qs');F.qt=g('qt');MS.q=S.mist.map((m,i)=>i).filter(i=>{const m=S.mist[i];return(F.qs===''||m.s==F.qs)&&(!F.qt||m.tags.includes(F.qt))&&(m.st!='resolved'||m.due<=td())});MS.i=0;MS.show=0;go('mist')}

V.exam=()=>{const ex=[...S.exams].sort((a,b)=>a.d>b.d?1:-1),t0=+new Date(ex[0]?.d),t1=+new Date(ex.at(-1)?.d),x=d=>t1>t0?40+(new Date(d)-t0)/(t1-t0)*330:205,y=v=>170-Math.max(0,v)*1.5;

<div class="card" style="margin-bottom:14px"><h3>Score trend (%)</h3><svg viewBox="0 0 400 190" width="100%" style="color:var(--mu)">${[0,50,100].map(v=>`<line x1="40" x2="380" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="4" y="${y(v)+4}" font-size="10" fill="currentColor">${v}%</text>`).join('')}${lines}</svg><div class="row">${SUB.map((s,i)=>`<span class="mu"><span style="color:${COL[i]}">●</span> ${s.replace(' Paper','')}</span>`).join('')}</div></div>
<div class="card"><div class="tw"><table><tr><th>Date</th><th>Exam</th><th>Subject</th><th>Marks</th><th>Accuracy</th><th>Negative lost</th><th>Rank</th><th></th></tr>${[...ex].reverse().map(e=>`<tr><td>${e.d}</td><td>${esc(e.n)}</td><td>${bdg(e.s)}</td><td>${e.o}/${e.t}</td><td>${(e.o/e.t*100).toFixed(1)}%</td><td>${e.g}</td><td>${esc(e.r)}</td><td><a class="x" onclick="S.exams.splice(S.exams.indexOf(S.exams.find(z=>z===S.exams[${S.exams.indexOf(e)}])),1);save();go('exam')">delete</a></td></tr>`).join('')||'<tr><td colspan="8" class="mu">No exam results yet.</td></tr>'}</table></div><div class="mu">Accuracy = obtained marks ÷ total marks. Negative marks are shown as marks lost.</div></div>`};
function addExam(){const t=+g('et'),o=+g('eo');if(!t||g('eo')==='')return alert('Enter total and obtained marks.');S.exams.push({n:g('en')||'Exam',d:gd('ed'),s:+g('es'),t,o,g:+g('eg')||0,r:g('er')});save();go('exam')}
V.syl=()=>{const pr=CH.map((c,i)=>sum(c,(_,j)=>0)||sum(c.map((_,j)=>S.syl[i+'|'+j]||0),v=>v)/(3*c.length)),all=pr.reduce((a,b)=>a+b,0)/7;
return `<h2>Syllabus Progress</h2><div class="card" style="margin-bottom:14px"><h3>Overall: ${Math.round(all*100)}%</h3><div class="bar"><b style="width:${all*100}%"></b></div></div>
${CH.map((c,i)=>`<details class="card" style="margin-bottom:10px"><summary style="cursor:pointer"><b>${SUB[i]}</b> <span class="mu">${Math.round(pr[i]*100)}%</span><div class="bar" style="margin-top:6px"><b style="width:${pr[i]*100}%;background:${COL[i]}"></b></div></summary>${c.map((n,j)=>{const v=S.syl[i+'|'+j]||0;return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd)"><div style="flex:2 1 180px">${EM[v]} ${n}</div><select style="flex:1 1 150px" onchange="S.syl['${i}|${j}']=+this.value;save();go('syl');document.querySelectorAll('details')[${i}].open=true">${ST.map((s,k)=>`<option value="${k}" ${k==v?'selected':''}>${s}</option>`).join('')}</select></div>`}).join('')}</details>`).join('')}`};
V.form=()=>{const L=S.forms.map((f,i)=>[f,i]).filter(([f])=>(F.fs===''||f.s==F.fs)&&(!F.fq||(f.ch+f.t).toLowerCase().includes(F.fq.toLowerCase())));
return `<h2>Formula Sheet</h2><div class="card" style="margin-bottom:14px"><h3>Add formula</h3><div class="row">${subPick('fs1',0,'fc')}${chSelect('fc',0)}</div><input id="ft" placeholder="e.g. E = mc^2   or   x_{n+1} = x_n - f(x_n)/f'(x_n)"><div class="mu" style="margin-bottom:8px">Use ^ for powers and _ for subscripts. Braces group more than one character.</div><button class="btn" onclick="addForm()">Save formula</button></div>
<div class="row" style="margin-bottom:14px"><input placeholder="Search formulas or chapters" value="${esc(F.fq)}" oninput="F.fq=this.value;fl()" id="fq"><select onchange="F.fs=this.value;go('form')">${opts(F.fs,1)}</select></div><div class="g g2" id="fl">${fc(L)}</div>`};
const fc=L=>L.map(([f,i])=>`<div class="card">${bdg(f.s)} <span class="mu">${esc(f.ch)}</span><div class="fx">${math(f.t)}</div><a class="x" onclick="S.forms.splice(${i},1);save();go('form')">delete</a></div>`).join('')||'<p class="mu">No formulas match. Try a different search.</p>';
function fl(){const L=S.forms.map((f,i)=>[f,i]).filter(([f])=>(F.fs===''||f.s==F.fs)&&(!F.fq||(f.ch+f.t).toLowerCase().includes(F.fq.toLowerCase())));$('#fl').innerHTML=fc(L)}
function addForm(){if(!g('ft'))return alert('Enter the formula.');S.forms.push({s:+g('fs1'),ch:g('fc'),t:g('ft')});save();go('form')}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.tilt');document.querySelectorAll('.tilt.on').forEach(x=>{if(x!==c){x.style.transform='';x.classList.remove('on')}});if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.classList.add('on');c.style.transform=`perspective(800px) rotateY(${x*9}deg) rotateX(${-y*9}deg) translateZ(6px)`});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('.tilt.on').forEach(x=>{x.style.transform='';x.classList.remove('on')})));
bootAuth();
</script></body></html>
